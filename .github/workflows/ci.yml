name: CI PR Review Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-review:
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Cache Maven dependencies (optional but improves speed)
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}

      # 4. Build + run unit tests
      - name: Build and test with Maven
        run: mvn clean test

      # 5. Run Checkstyle (code quality check)
      - name: Run Checkstyle
        run: mvn checkstyle:checkstyle

      # 6. Upload Checkstyle results as PR comments (inline review)
      - name: Publish Checkstyle report as PR comments
        uses: dbelyaev/action-checkstyle@v1
        with:
          report_path: target/checkstyle-result.xml